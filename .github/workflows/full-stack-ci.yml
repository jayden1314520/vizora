name: Full stack CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vizora-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vizora-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:prod

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vizora-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: vizora-server/pom.xml
      - run: mvn --batch-mode --update-snapshots -DskipTests package
